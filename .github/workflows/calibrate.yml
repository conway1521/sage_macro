# Calibrations on GitHub's runners, one job per country and configuration, in
# parallel. Started by hand from the Actions tab ("Run workflow"). Each job
# writes its calibration file and log as an artifact; download them and commit
# the ones you accept. Free for public repositories; each job may run up to six
# hours on a 4-core runner, so three worker processes are used (about 2.5 GB
# each at na = 200).
name: calibrate
permissions:
  actions: write
  contents: read
on:
  workflow_dispatch:
    inputs:
      solver:
        description: "Household solver: egm (default) or grid (the reference)"
        default: "egm"
      countries:
        description: "Country codes, space separated"
        default: "FR DE IT"
      configs:
        description: "Configurations, space separated (G GA GS GSA; with E: GE GAE GSE GSAE)"
        default: "GSA GS GA G"
      budget:
        description: "Minutes a job may run before it keeps its checkpoints and hands over"
        default: "320"
      resume_from:
        description: "Run id whose checkpoints to resume from (set automatically)"
        default: ""
      hop:
        description: "How many times this calibration has been resumed (set automatically; stops at 5)"
        default: "0"
      v3:
        description: "Version 3 regime (effort set by the job, household replacement rate, HFCS liquid-wealth targets): 1 or 0"
        default: "0"
      floor:
        description: "Floor regime with v3=1 (the means-tested floor in the base; files calibration_v3f_*): 1 or 0"
        default: "0"
      floor_from:
        description: "The configuration in which the floor is fitted, read by the others (G, or GE with places)"
        default: "G"
      edu:
        description: "Patience by education with v3=1 (files calibration_v3e_*, with the floor calibration_v3fe_*): 1 or 0"
        default: "0"
      prereq:
        description: "Calibration file this one needs, from an earlier run's artifact: 'run id:artifact:file' (set by .github/chain.sh)"
        default: ""
      chain:
        description: "On success, start the calibrations that need this one (.github/chain.sh); nothing is committed"
        default: "yes"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          c = os.environ["C"].split(); g = os.environ["G"].split()
          print("matrix=" + json.dumps({"include": [{"code": a, "cfg": b} for a in c for b in g]}))
          PY
        env:
          C: ${{ inputs.countries }}
          G: ${{ inputs.configs }}
  calibrate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.7.2"
      - uses: julia-actions/cache@v2
      - name: Restore household families
        uses: actions/cache@v4
        with:
          path: SAGE_Bewley/scripts/cache_families
          key: families-${{ matrix.code }}-${{ matrix.cfg }}-${{ hashFiles('SAGE_Bewley/src/**', 'SAGE_Bewley/scripts/*_core.jl', 'SAGE_Bewley/scripts/agency_shock.jl') }}-${{ github.run_id }}
          restore-keys: |
            families-${{ matrix.code }}-${{ matrix.cfg }}-${{ hashFiles('SAGE_Bewley/src/**', 'SAGE_Bewley/scripts/*_core.jl', 'SAGE_Bewley/scripts/agency_shock.jl') }}-
      - name: Instantiate
        run: julia --project=SAGE_Bewley/scripts/run_env -e 'using Pkg; Pkg.instantiate()'
      - name: Fetch the calibration this one needs
        if: inputs.prereq != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRE: ${{ inputs.prereq }}
        run: |
          IFS=: read -r rid art file <<< "$PRE"
          gh run download "$rid" -n "$art" -D /tmp/pre
          cp "/tmp/pre/$file" SAGE_Bewley/scripts/ && echo "using $file from run $rid"
      - name: Fetch the checkpoints to resume from
        if: inputs.resume_from != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.resume_from }} -n calibration-${{ matrix.code }}-${{ matrix.cfg }} -D /tmp/ck || true
          mkdir -p SAGE_Bewley/scripts/checkpoints
          cp /tmp/ck/checkpoints/* SAGE_Bewley/scripts/checkpoints/ 2>/dev/null && echo "checkpoints restored" || echo "no checkpoints found"
      - name: Calibrate ${{ matrix.code }} ${{ matrix.cfg }}
        id: cal
        env:
          SAGE_WORKERS: "3"
          SAGE_SOLVER: ${{ inputs.solver }}
          SAGE_TIME_BUDGET_MIN: ${{ inputs.budget }}
          SAGE_V3: ${{ inputs.v3 }}
          SAGE_FLOOR: ${{ inputs.floor }}
          SAGE_EDU: ${{ inputs.edu }}
          SAGE_FLOOR_FROM: ${{ inputs.floor_from }}
        run: |
          cd SAGE_Bewley
          set +e
          julia --project=scripts/run_env scripts/calibrate_country.jl ${{ matrix.code }} ${{ matrix.cfg }} 2>&1 | tee scripts/calibrate_${{ matrix.code }}_${{ matrix.cfg }}.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # exit 2 means "not calibrated", a legitimate outcome that is reported, not a failure;
          # exit 3 means the time budget was reached and a new job resumes
          [ "$code" = "0" ] || [ "$code" = "2" ] || [ "$code" = "3" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-${{ matrix.code }}-${{ matrix.cfg }}
          path: |
            SAGE_Bewley/scripts/calibration_country_${{ matrix.code }}*.txt
            SAGE_Bewley/scripts/calibration_v3_${{ matrix.code }}*.txt
            SAGE_Bewley/scripts/calibration_v3f_${{ matrix.code }}*.txt
            SAGE_Bewley/scripts/calibration_v3e_${{ matrix.code }}*.txt
            SAGE_Bewley/scripts/calibration_v3fe_${{ matrix.code }}*.txt
            SAGE_Bewley/scripts/calibrate_${{ matrix.code }}_${{ matrix.cfg }}.log
            SAGE_Bewley/scripts/checkpoints/${{ matrix.code }}_${{ matrix.cfg }}_*
      - name: Start the calibrations that need this one
        if: steps.cal.outputs.code == '0' && inputs.chain == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: SAGE_V3=${{ inputs.v3 }} SAGE_FLOOR=${{ inputs.floor }} SAGE_EDU=${{ inputs.edu }} SAGE_FLOOR_FROM=${{ inputs.floor_from }} bash .github/chain.sh 1 ${{ matrix.code }} ${{ matrix.cfg }}
      - name: Resume in a new run
        if: steps.cal.outputs.code == '3' && inputs.hop < 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run calibrate.yml --ref ${{ github.ref_name }} -f solver=${{ inputs.solver }} -f countries=${{ matrix.code }} \
            -f configs=${{ matrix.cfg }} -f budget=${{ inputs.budget }} -f resume_from=${{ github.run_id }} -f hop=$(( ${{ inputs.hop }} + 1 )) \
            -f prereq="${{ inputs.prereq }}" -f chain=${{ inputs.chain }} -f v3=${{ inputs.v3 }} -f floor=${{ inputs.floor }} -f edu=${{ inputs.edu }} -f floor_from=${{ inputs.floor_from }}
