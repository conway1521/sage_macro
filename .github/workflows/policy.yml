# Policy tests (subsidy, empowerment, insurance up and down; A on and off; three
# social technologies), one job per country (the equilibrium count is equilibria.yml), on the
# committed calibrations. Started by hand.
name: policy
on:
  workflow_dispatch:
    inputs:
      solver:
        description: "Household solver: grid (reference) or egm"
        default: "grid"
      countries:
        description: "Country codes, space separated"
        default: "FR DE IT"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          print("matrix=" + json.dumps({"code": os.environ["C"].split()}))
          PY
        env:
          C: ${{ inputs.countries }}
  policy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.7.2"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=SAGE_Bewley/scripts/run_env -e 'using Pkg; Pkg.instantiate()'
      - name: Policy tests ${{ matrix.code }}
        env:
          SAGE_WORKERS: "3"
          SAGE_SOLVER: ${{ inputs.solver }}
        run: |
          cd SAGE_Bewley
          julia --project=scripts/run_env scripts/policy_tests.jl ${{ matrix.code }} 2>&1 | tee scripts/policy_tests_${{ matrix.code }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-${{ matrix.code }}
          path: |
            SAGE_Bewley/scripts/policy_tests_${{ matrix.code }}.txt
            SAGE_Bewley/scripts/policy_results_${{ matrix.code }}.csv
