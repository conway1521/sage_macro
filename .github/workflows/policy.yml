# Policy tests (subsidy, empowerment, insurance up and down; A on and off; three
# social technologies) and the equilibrium count, one job per country, on the
# committed calibrations. Started by hand.
name: policy
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Country codes, space separated"
        default: "FR DE IT"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: echo "matrix=$(python3 -c 'import json,os; print(json.dumps({"code": os.environ["C"].split()}))')" >> "$GITHUB_OUTPUT"
        env:
          C: ${{ inputs.countries }}
  policy:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.7.2"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=SAGE_Bewley/scripts/run_env -e 'using Pkg; Pkg.instantiate()'
      - name: Policy tests ${{ matrix.code }}
        env:
          SAGE_WORKERS: "3"
        run: |
          cd SAGE_Bewley
          julia --project=scripts/run_env scripts/policy_tests.jl ${{ matrix.code }} 2>&1 | tee scripts/policy_tests_${{ matrix.code }}.txt
          julia --project=scripts/run_env scripts/policy_equilibria.jl ${{ matrix.code }} 2>&1 | tee scripts/policy_equilibria_${{ matrix.code }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: policy-${{ matrix.code }}
          path: |
            SAGE_Bewley/scripts/policy_tests_${{ matrix.code }}.txt
            SAGE_Bewley/scripts/policy_results_${{ matrix.code }}.csv
            SAGE_Bewley/scripts/policy_equilibria_${{ matrix.code }}.txt
