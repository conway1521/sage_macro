# Any short diagnostic script in SAGE_Bewley/scripts, run on a runner so the
# laptop can be closed. Started by hand with the script's file name.
name: probe
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in SAGE_Bewley/scripts, e.g. probe_gs_identification.jl"
        required: true
      args:
        description: "Arguments for the script (optional)"
        default: ""
      solver:
        description: "Household solver: egm (default) or grid (the reference)"
        default: "egm"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.7.2"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=SAGE_Bewley/scripts/run_env -e 'using Pkg; Pkg.instantiate()'
      - name: Run ${{ inputs.script }}
        env:
          SAGE_WORKERS: "3"
          SAGE_SOLVER: ${{ inputs.solver }}
        run: |
          cd SAGE_Bewley
          set -o pipefail
          julia --project=scripts/run_env scripts/${{ inputs.script }} ${{ inputs.args }} 2>&1 | tee scripts/probe_output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-output-${{ github.run_id }}
          path: SAGE_Bewley/scripts/probe_output.txt
