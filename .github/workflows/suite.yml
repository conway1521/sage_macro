# The modularity suite at France's calibrated footing, in two parallel parts
# so each fits the six-hour limit: the reductions, and the convergence rows
# (the doubled asset grid is left to conv_na400.jl). Started by hand.
name: suite
on:
  workflow_dispatch:
    inputs:
      solver:
        description: "Household solver: grid (reference) or egm"
        default: "grid"
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: [reductions, convergence]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.7.2"
      - uses: julia-actions/cache@v2
      - name: Instantiate
        run: julia --project=SAGE_Bewley/scripts/run_env -e 'using Pkg; Pkg.instantiate()'
      - name: Suite, ${{ matrix.part }}
        env:
          SAGE_WORKERS: "3"
          SAGE_SOLVER: ${{ inputs.solver }}
          SUITE_PART: ${{ matrix.part }}
          SUITE_SKIP_NA400: "1"
        run: |
          cd SAGE_Bewley
          set -o pipefail
          julia --project=scripts/run_env scripts/test_modular.jl 2>&1 | tee scripts/test_modular_${{ matrix.part }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.part }}
          path: SAGE_Bewley/scripts/test_modular_${{ matrix.part }}.txt
